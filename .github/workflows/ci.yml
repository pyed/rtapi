name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  verify:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.7", "1.27.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Verify module
        run: |
          go mod tidy -diff
          go mod verify
      - name: Test, vet, and build
        run: |
          go test -count=1 ./...
          go vet ./...
          go build ./...
      - name: Race detector
        if: matrix.go == '1.26.7'
        run: go test -race -count=1 ./...
      - name: 32-bit tests
        if: matrix.go == '1.26.7'
        run: GOARCH=386 CGO_ENABLED=0 go test -count=1 ./...
      - name: Vulnerability scan
        if: matrix.go == '1.26.7'
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          repo-checkout: false
          go-version-input: "1.26.7"
          go-package: ./...

  rtorrent:
    name: Against rTorrent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: false
      - name: Start rTorrent
        run: |
          sudo apt-get update
          sudo apt-get install -y rtorrent
          rt="$RUNNER_TEMP/rtorrent"
          mkdir -p "$rt/session" "$rt/downloads"
          cat > "$rt/rtorrent.rc" <<RC
          directory.default.set = $rt/downloads
          session.path.set = $rt/session
          session.use_lock.set = no
          network.scgi.open_local = $rt/rpc.socket
          network.port_range.set = 50000-50010
          dht.mode.set = disable
          protocol.pex.set = no
          trackers.use_udp.set = no
          system.daemon.set = true
          RC
          cat > "$rt/start.sh" <<'START'
          rt="$RUNNER_TEMP/rtorrent"
          rm -f "$rt/rpc.socket"
          rtorrent -n -o import="$rt/rtorrent.rc" >> "$rt/output.log" 2>&1 &
          echo $! > "$rt/rtorrent.pid"
          for _ in $(seq 100); do [ -S "$rt/rpc.socket" ] && exit 0; sleep 0.1; done
          cat "$rt/output.log"
          exit 1
          START
          bash "$rt/start.sh"
      - name: Test against rTorrent
        env:
          RTAPI_TEST_RTORRENT: ${{ runner.temp }}/rtorrent/rpc.socket
          RTAPI_TEST_RESTART: before
        run: go test -count=1 -run Integration -v ./...
      - name: Restart rTorrent
        run: |
          # Restart in a later second than the tests started anything. libtorrent
          # names rTorrent's main thread, which renames the process, so stop it
          # by its PID.
          sleep 2
          pid=$(cat "$RUNNER_TEMP/rtorrent/rtorrent.pid")
          kill -TERM "$pid"
          for _ in $(seq 100); do kill -0 "$pid" 2> /dev/null || break; sleep 0.1; done
          if kill -0 "$pid" 2> /dev/null; then echo "rTorrent did not stop"; exit 1; fi
          bash "$RUNNER_TEMP/rtorrent/start.sh"
      - name: Test across the restart
        env:
          RTAPI_TEST_RTORRENT: ${{ runner.temp }}/rtorrent/rpc.socket
          RTAPI_TEST_RESTART: after
        run: go test -count=1 -run IntegrationAcrossRestart -v ./...
